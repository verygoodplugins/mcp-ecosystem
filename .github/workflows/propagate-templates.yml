name: Propagate Templates

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/propagate-templates.yml"
      - "scripts/apply-templates.sh"
      - "scripts/describe-server.mjs"
      - "scripts/propagate-templates.sh"
      - "scripts/render-managed-files.mjs"
      - "scripts/sync-template-baseline.mjs"
      - "scripts/validate-sync.mjs"
      - "scripts/lib/**"
      - "config/**"
      - "server-inventory.json"
      - "templates/**"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      server:
        description: "Optional server name from server-inventory.json"
        required: false
        type: string
      dry_run:
        description: "Preview only without opening PRs"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: propagate-templates
  cancel-in-progress: false

jobs:
  propagate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Validate toolchain
        run: |
          command -v gh
          command -v jq
          command -v git
          command -v node
          command -v uv

      - name: Propagate templates
        env:
          GH_TOKEN: ${{ github.token }}
          VGP_TEMPLATE_SYNC_TOKEN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && secrets.VGP_TEMPLATE_SYNC_TOKEN || '' }}
          INPUT_EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVER: ${{ inputs.server }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()

          if [[ -n "${INPUT_SERVER}" ]]; then
            ARGS+=(--server "${INPUT_SERVER}")
          fi

          if [[ "${INPUT_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_DRY_RUN}" == "false" ]]; then
            if [[ -z "${VGP_TEMPLATE_SYNC_TOKEN}" ]]; then
              echo "Missing VGP_TEMPLATE_SYNC_TOKEN secret for write propagation"
              exit 1
            fi
            GH_TOKEN="${VGP_TEMPLATE_SYNC_TOKEN}"
          else
            ARGS+=(--dry-run)
          fi

          export GH_TOKEN
          gh auth setup-git

          chmod +x scripts/apply-templates.sh scripts/propagate-templates.sh
          ./scripts/propagate-templates.sh "${ARGS[@]}"
