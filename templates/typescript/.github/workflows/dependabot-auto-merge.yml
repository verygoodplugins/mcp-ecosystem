name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      ${{
        (
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.user.login == 'dependabot[bot]' &&
          !github.event.pull_request.draft
        ) ||
        (
          github.event_name == 'workflow_run' &&
          (
            github.event.workflow_run.event == 'pull_request' ||
            github.event.workflow_run.event == 'pull_request_target'
          ) &&
          github.event.workflow_run.conclusion == 'success'
        )
      }}
    uses: verygoodplugins/.github/.github/workflows/dependabot-auto-merge.yml@main
    # `secrets: inherit`, not an explicit `GH_TOKEN:` mapping. A called workflow only
    # receives the secrets its caller forwards, and the reusable workflow mints a
    # GitHub App token from AUTOMERGE_APP_CLIENT_ID / AUTOMERGE_APP_PRIVATE_KEY.
    # Listing GH_TOKEN alone silently withholds those, and the job then runs degraded:
    # auto-merge still works, but GitHub does not start push-triggered workflows (CI,
    # Release Please, security scans) from a merge GITHUB_TOKEN performed.
    secrets: inherit
